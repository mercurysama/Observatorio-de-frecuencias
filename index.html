<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plantilla del Observatorio</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(95vw, 1000px);
      text-align: center;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    p {
      margin-top: 16px;
      color: #444;
    }
  </style>
</head>

<body>
  <main>
    <img
      src="recursos/imagenes/templete.jpg"
      alt="Plantilla visual del Observatorio de Frecuencias"
    />

    <p>Plantilla visual oficial del Observatorio de Frecuencias.</p>
  </main>
</body>
</html>
